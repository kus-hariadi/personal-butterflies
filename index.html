const currentEl = document.getElementById("currentLyric");
const nextEl = document.getElementById("nextLyric");

audio.addEventListener("timeupdate", () => {
  const now = audio.currentTime;

  for (let i = timeline.length - 1; i >= 0; i--) {
    if (now >= timeline[i].time) {

      // current lyric
      currentEl.innerText = timeline[i].text;
      currentEl.style.opacity = 1;

      // previous lyric
      prevEl.innerText = timeline[i - 1]?.text || "";
      prevEl.style.opacity = prevEl.innerText ? 0.35 : 0;

      // next lyric
      nextEl.innerText = timeline[i + 1]?.text || "";
      nextEl.style.opacity = nextEl.innerText ? 0.35 : 0;

      break;
    }
  }
});
