<!DOCTYPE html>
<html lang="en">

</div>

    <!-- AUDIO PLAYER -->
  <audio id="music" src="lagu.mp3" loop></audio>

  <script>
    // auto play setelah user klik pertama kali
    const startMusic = () => {
      const audio = document.getElementById("music");
      audio.play().catch(() => {});
    };

    window.addEventListener("click", startMusic, { once: true });
    window.addEventListener("touchstart", startMusic, { once: true });
  </script>

  <!-- TEMPAT LIRIK -->
<div id="lyrics"
     style="position: fixed; bottom: 40px; width: 100%; text-align: center; color:white; font-size:18px; text-shadow:0 0 10px #000; font-family: Montserrat;">
</div>

<script>
  // audio & lirik
  const audio = document.getElementById("music");
  const lyricsBox = document.getElementById("lyrics");

  // TIMELINE LIRIK
  const timeline = [
  { time: 0, text: "" },
  { time: 11, text: "Zahra, wrap me up in all your, I want you in my arms Oh, let me hold you" },
  { time: 28, text: "I'll never let you go again like I did, Oh I used to say" },
  { time: 37, text: "I would never fall in love again until I found her I said, I would never fall unless" },
  { time: 48, text: "it's you I fall into, I was lost within the darkness, but then I found her, I found you" },
  { time: 67, text: "Zahra, pulled me in, I asked to, Love her once again, You fell, I caught you" },
  { time: 85, text: "I'll never let you go again like I did, Oh, I used to say" },
  { time: 95, text: "I would never fall in love again until I found her I said, I would never fall unless" },
  { time: 105, text: "it's you I fall into I was lost within the darkness, but then I found her, I found you" },
  { time: 137, text: "I would never fall in love again until I found her I said, I would never fall unless" },
  { time: 148, text: "it's you I fall into, I was lost within the darkness, but then I found her, I found you" },
  
];


  // Update lirik tiap ada perubahan waktu
  const prevEl = document.getElementById("prevLyric");
const currentEl = document.getElementById("currentLyric");
const nextEl = document.getElementById("nextLyric");

audio.addEventListener("timeupdate", () => {
  const now = audio.currentTime;

  for (let i = timeline.length - 1; i >= 0; i--) {
    if (now >= timeline[i].time) {

      // current lyric
      currentEl.innerText = timeline[i].text;
      currentEl.style.opacity = 1;

      // previous lyric
      prevEl.innerText = timeline[i - 1]?.text || "";
      prevEl.style.opacity = prevEl.innerText ? 0.35 : 0;

      // next lyric
      nextEl.innerText = timeline[i + 1]?.text || "";
      nextEl.style.opacity = nextEl.innerText ? 0.35 : 0;

      break;
    }
  }
});


</script>

  
    <div id="app">

            But losing contact with you hurts the most.
            If you ever come back here, I hope you’ll reach out.
            My feelings haven’t changed.
        </h5>
      </div>
    </div>

    <script type="module" src="butterflies.js"></script>
  </body>
</html>
